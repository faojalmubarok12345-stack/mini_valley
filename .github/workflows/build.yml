name: Build NDS ROM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile proyek menjadi .nds
        run: make

      - name: Upload file .nds
        uses: actions/upload-artifact@v4
        with:
          name: mini-valley-ds-rom
          path: "*.nds"
